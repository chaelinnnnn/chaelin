<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaelin Kim</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #FF6FD6; --gray: #999; --line: #e8e8e8; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
      font-size: 13px; line-height: 1.5; background: #fff; color: #000;
      -webkit-font-smoothing: antialiased;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23FF6FD6" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, auto;
    }
    a { text-decoration: none; color: inherit; }

    /* 3컬럼 레이아웃 */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== LEFT: 로고 + 이름 + 이메일 ===== */
    .col-left {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 32px 24px 32px;
      border-right: 1px solid var(--line);
      height: 100vh;
      overflow: hidden;
    }
    .logo-wrap {
      width: 110px;
      height: 62px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .logo-wrap video {
      width: 136px;
      margin-left: -13px;
    }
    .name-text {
      font-size: 15px;
      font-weight: 600;
      color: #000;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .email-text {
      font-size: 12px;
      color: var(--gray);
    }
    .left-links {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .left-link {
      font-size: 12px;
      color: var(--gray);
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: color 0.15s;
    }
    .left-link:hover { color: var(--pink); }

    /* ===== MIDDLE: 프로젝트 목록 ===== */
    .col-mid {
      border-right: 1px solid var(--line);
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .col-mid::-webkit-scrollbar { width: 0; }

    .mid-header {
      padding: 20px 20px 0;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }
    .mid-header-title {
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 12px;
    }

    .proj-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: background 0.1s;
      text-decoration: none;
      color: inherit;
    }
    .proj-item * { cursor: inherit !important; }
    .proj-item:hover { background: #fafafa; }
    .proj-item:hover .proj-item-title { color: var(--pink); }
    .proj-item.hovered .proj-item-title { color: var(--pink); }

    .proj-item-thumb {
      flex-shrink: 0;
      width: 52px;
      height: 36px;
      overflow: hidden;
      background: #f5f5f5;
    }
    .proj-item-thumb img,
    .proj-item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .proj-item-info { min-width: 0; flex: 1; }
    .proj-item-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
      margin-bottom: 1px;
    }
    .proj-item-type {
      font-size: 11px;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== RIGHT: 호버 프리뷰 ===== */
    .col-right {
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-empty {
      text-align: center;
      color: #ddd;
      font-size: 12px;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .preview-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      padding: 40px;
    }
    .preview-wrap.on { opacity: 1; }
    .preview-media {
      max-width: 420px;
      width: 100%;
    }
    .preview-media img,
    .preview-media video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .preview-info {
      text-align: center;
    }
    .preview-info-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
      color: #000;
    }
    .preview-info-type {
      font-size: 11px;
      color: var(--gray);
    }

    /* 커스텀 커서 별 트레일 */
    .star { position: fixed; pointer-events: none; z-index: 99999; animation: starfall 1s ease-in forwards; }
    @keyframes starfall {
      from { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      to   { transform: translateY(100px) rotate(180deg) scale(0); opacity: 0; }
    }

    /* ===== 모바일 ===== */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: 100vh;
      }
      .col-left {
        flex-direction: row;
        align-items: center;
        height: auto;
        padding: 16px 20px;
        border-right: none;
        border-bottom: 1px solid var(--line);
        gap: 16px;
      }
      .logo-wrap { margin-bottom: 0; width: 56px; height: 32px; flex-shrink: 0; }
      .logo-wrap video { width: 70px; margin-left: -7px; }
      .left-links { flex-direction: row; margin-top: 0; gap: 12px; }
      .col-right { display: none; }
      .col-mid {
        border-right: none;
        height: auto;
        overflow-y: visible;
      }
    }
  </style>
</head>
<body>

<div class="layout">
  <!-- LEFT: 로고 + 이름 + 이메일 -->
  <div class="col-left">
    <div class="logo-wrap">
      <video autoplay loop muted playsinline><source src="logo.mp4" type="video/mp4"></video>
    </div>
    <div style="flex:1;">
      <div class="name-text">Chaelin Kim</div>
      <div class="email-text">linworkingon@gmail.com</div>
    </div>
    <div class="left-links">
      <a class="left-link" href="Resume_Chaelin_Kim.pdf" target="_blank" rel="noopener noreferrer">CV ↗</a>
    </div>
  </div>

  <!-- MIDDLE: 프로젝트 목록 -->
  <div class="col-mid" id="col-mid">
    <div class="mid-header">
      <div class="mid-header-title">Projects</div>
    </div>
    <div id="project-list">
      <div style="padding:20px;color:#ccc;">Loading&#8230;</div>
    </div>
  </div>

  <!-- RIGHT: 호버 프리뷰 -->
  <div class="col-right" id="col-right">
    <div class="preview-empty" id="preview-empty">—</div>
    <div class="preview-wrap" id="preview-wrap">
      <div class="preview-media" id="preview-media">
        <video id="preview-video" autoplay loop muted playsinline style="display:none;"></video>
        <img id="preview-img" alt="" style="display:none;">
      </div>
      <div class="preview-info">
        <div class="preview-info-title" id="preview-title"></div>
        <div class="preview-info-type" id="preview-type"></div>
      </div>
    </div>
  </div>
</div>

<script>
// 별 커서 트레일
var lastStar = 0;
document.addEventListener('mousemove', function(e) {
  var now = Date.now();
  if (now - lastStar < 50) return;
  lastStar = now;
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'star');
  s.setAttribute('width', '12');
  s.setAttribute('height', '12');
  s.setAttribute('viewBox', '0 0 24 24');
  s.style.left = e.clientX + 'px';
  s.style.top = e.clientY + 'px';
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('fill', '#FF6FD6');
  p.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z');
  s.appendChild(p);
  document.body.appendChild(s);
  setTimeout(function() { s.remove(); }, 1000);
});

var listEl = document.getElementById('project-list');
var previewWrap = document.getElementById('preview-wrap');
var previewMedia = document.getElementById('preview-media');
var previewEmpty = document.getElementById('preview-empty');
var previewVideo = document.getElementById('preview-video');
var previewImg = document.getElementById('preview-img');
var previewTitle = document.getElementById('preview-title');
var previewType = document.getElementById('preview-type');
var previewTimeout = null;

function showPreview(project) {
  if (previewTimeout) { clearTimeout(previewTimeout); previewTimeout = null; }
  var thumb = project.thumbnail;
  if (!thumb || !thumb.src) return;

  if (thumb.type === 'video') {
    if (previewVideo.getAttribute('data-src') !== thumb.src) {
      previewVideo.src = thumb.src;
      previewVideo.setAttribute('data-src', thumb.src);
    }
    previewVideo.style.display = 'block';
    previewImg.style.display = 'none';
  } else {
    previewImg.src = thumb.src;
    previewImg.style.display = 'block';
    previewVideo.style.display = 'none';
    previewVideo.src = '';
    previewVideo.removeAttribute('data-src');
  }

  previewTitle.textContent = project.title || '';
  previewType.textContent = project.type || '';
  previewWrap.classList.add('on');
  previewEmpty.style.opacity = '0';
}

function hidePreview() {
  previewTimeout = setTimeout(function() {
    previewWrap.classList.remove('on');
    previewEmpty.style.opacity = '1';
    setTimeout(function() {
      if (!previewWrap.classList.contains('on')) {
        previewVideo.src = '';
        previewVideo.removeAttribute('data-src');
        previewImg.src = '';
      }
    }, 300);
  }, 80);
}

function renderThumb(p) {
  if (!p.thumbnail || !p.thumbnail.src) return '';
  if (p.thumbnail.type === 'video') {
    return '<video autoplay loop muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;"><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
  }
  return '<img src="' + p.thumbnail.src + '" alt="' + (p.title || '') + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
}

function renderList(projects) {
  if (!projects.length) {
    listEl.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>';
    return;
  }

  listEl.innerHTML = projects.map(function(p) {
    var isExt = !!p.externalUrl;
    var href = isExt ? p.externalUrl : 'portfolio.html?id=' + encodeURIComponent(p.id);
    var target = isExt ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a class="proj-item" href="' + href + '"' + target + ' data-id="' + p.id + '">' +
      '<div class="proj-item-thumb">' + renderThumb(p) + '</div>' +
      '<div class="proj-item-info">' +
        '<div class="proj-item-title">' + (p.title || '') + '</div>' +
        '<div class="proj-item-type">' + (p.type || '') + '</div>' +
      '</div>' +
    '</a>';
  }).join('');

  listEl.querySelectorAll('.proj-item').forEach(function(item) {
    var id = item.dataset.id;
    var proj = projects.find(function(p) { return p.id === id; });
    if (!proj) return;

    item.addEventListener('mouseenter', function() {
      listEl.querySelectorAll('.proj-item').forEach(function(r) { r.classList.remove('hovered'); });
      item.classList.add('hovered');
      showPreview(proj);
    });
    item.addEventListener('mouseleave', function() {
      item.classList.remove('hovered');
      hidePreview();
    });
  });
}

fetch('./projects-data.json', { cache: 'no-store' })
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    var projects = data.projects || [];
    renderList(projects);
  })
  .catch(function(err) {
    console.error(err);
    listEl.innerHTML = '<div style="padding:20px;color:red;">Failed to load projects: ' + err.message + '</div>';
  });
</script>
</body>
</html>
