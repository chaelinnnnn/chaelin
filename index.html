<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaelin Kim</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #FF6FD6; --gray: #999; --line: #e8e8e8; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
      font-size: 13px; line-height: 1.5; background: #fff; color: #000;
      -webkit-font-smoothing: antialiased;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23FF6FD6" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, auto;
    }
    a { text-decoration: none; color: inherit; cursor: inherit; }
    .layout { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
    .left { display: flex; flex-direction: column; height: 100vh; border-right: 1px solid var(--line); overflow: hidden; }
    .left-top { flex-shrink: 0; padding: 8px 20px 0; }
    .logo-wrap { width: 120px; height: 68px; overflow: hidden; margin-bottom: 16px; margin-top: 8px; }
    .logo-wrap a { display: block; cursor: url("cursor-hand.png") 16 16, pointer !important; }
    .logo-wrap a * { cursor: inherit !important; }
    .logo-wrap video { width: 148px; margin-left: -14px; }
    .info-btn { font-size: 13px; font-weight: 400; color: #000; cursor: url("cursor-hand.png") 16 16, pointer !important; transition: color 0.15s; }
    .info-btn:hover { color: var(--pink); }
    .cat-nav { display: flex; flex-wrap: wrap; gap: 1px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
    .cat-nav button { background: none; border: none; font-size: 13px; font-weight: 400; color: #000; cursor: url("cursor-hand.png") 16 16, pointer !important; padding: 2px 0; text-align: left; transition: color 0.15s; font-family: inherit; }
    .cat-nav button:hover, .cat-nav button.on { color: var(--pink); }
    .project-list { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 36px; border-top: 1px solid var(--line); }
    .project-list::-webkit-scrollbar { width: 0; }
    .proj-row { display: block; padding: 12px 20px; border-bottom: 1px solid var(--line); cursor: url("cursor-hand.png") 16 16, pointer !important; transition: background 0.1s; }
    .proj-row * { cursor: inherit !important; }
    .proj-row:hover, .proj-row.on { background: #fafafa; }
    .proj-row:hover .proj-title, .proj-row.on .proj-title { color: var(--pink); }
    .proj-title { font-size: 17px; font-weight: 600; line-height: 1.4; transition: color 0.15s; margin-bottom: 2px; }
    .proj-type { font-size: 11px; color: var(--gray); }
    .right { height: 100vh; overflow-y: auto; background: #fff; }
    .right::-webkit-scrollbar { width: 0; }
    #r-grid { display: none; padding: 20px; }
    #r-grid.on { display: block; }
    .thumb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .thumb-card { display: block; cursor: url("cursor-hand.png") 16 16, pointer !important; }
    .thumb-card * { cursor: inherit !important; }
    .thumb-media { width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #f7f7f7; }
    .thumb-media img, .thumb-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-info { margin-top: 8px; margin-bottom: 4px; }
    .thumb-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; transition: color 0.15s; }
    .thumb-card:hover .thumb-title { color: var(--pink); }
    .thumb-type { font-size: 11px; color: var(--gray); }
    #r-detail { display: none; padding: 44px 48px 100px; }
    #r-detail.on { display: block; }
    .d-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }
    .d-left {}
    .d-title { font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
    .d-meta { font-size: 12px; color: var(--gray); margin-bottom: 3px; }
    .d-collab { font-size: 12px; color: var(--gray); margin-top: 16px; }
    .d-desc { font-size: 13px; line-height: 1.8; color: #333; }
    .d-sections { display: flex; flex-direction: column; margin-top: 40px; margin-bottom: 40px; }
    .d-section-wrap { border-top: 1px solid var(--line); padding-bottom: 32px; }
    .d-section-wrap:last-child { border-bottom: none; }
    .d-section { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 16px 0 16px; }
    .d-section-title { font-size: 13px; font-weight: 400; color: #000; }
    .d-section-desc { font-size: 13px; line-height: 1.8; color: #333; }
    .gallery { display: flex; flex-direction: column; gap: 10px; }
    .gallery img, .gallery video { width: 100%; display: block; }
    .gallery video { background: #000; }
    .vimeo-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .vimeo-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .embed-box { width: 100%; height: 80vh; border: none; display: block; }

    /* 슬라이드쇼 */
    .slideshow {
      margin: 10px 0;
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 80px;
    }
    .slideshow-track {
      width: 100%;
      overflow: hidden;
    }
    .slideshow-track img {
      width: 100%;
      display: none;
      object-fit: contain;
      max-height: 75vh;
    }
    .slideshow-track img.active { display: block; }
    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      color: #fff;
      padding: 8px 16px;
      z-index: 2;
      opacity: 0.6;
      transition: opacity 0.15s;
      letter-spacing: 2px;
    }
    .slide-btn:hover { opacity: 1; }
    .slide-btn.prev { left: 16px; }
    .slide-btn.next { right: 16px; }

    /* experiment 뷰 */
    #r-experiment { display: none; padding: 20px; }
    #r-experiment.on { display: block; }
    .exp-grid { columns: 3; column-gap: 20px; }
    .exp-card { break-inside: avoid; margin-bottom: 20px; display: block; cursor: url("cursor-hand.png") 16 16, pointer !important; position: relative; overflow: hidden; }
    .exp-card * { cursor: inherit !important; }
    .exp-card img, .exp-card video { width: 100%; display: block; }
    .exp-card-info { padding: 8px 0 4px; }
    .exp-card-title { font-size: 13px; font-weight: 600; color: #000; margin-bottom: 2px; transition: color 0.15s; }
    .exp-card:hover .exp-card-title { color: var(--pink); }
    .exp-card-type { font-size: 11px; color: var(--gray); }
    .exp-card.size-small .exp-thumb { aspect-ratio: 3/2; overflow: hidden; }
    .exp-card.size-medium .exp-thumb { aspect-ratio: 1/1; overflow: hidden; }
    .exp-card.size-large .exp-thumb { aspect-ratio: 2/3; overflow: hidden; }
    .exp-card .exp-thumb img, .exp-card .exp-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .star { position: fixed; pointer-events: none; z-index: 99999; animation: starfall 1s ease-in forwards; }
    @keyframes starfall {
      from { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      to   { transform: translateY(100px) rotate(180deg) scale(0); opacity: 0; }
    }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .right { display: none; } }
  </style>
</head>
<body>
<div class="layout">
  <div class="left">
    <div class="left-top">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <div class="logo-wrap" style="margin-bottom:0;">
          <a href="#" id="logo-link">
            <video autoplay loop muted playsinline><source src="logo.mp4" type="video/mp4"></video>
          </a>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <a class="info-btn" href="Resume_Chaelin_Kim.pdf" target="_blank" rel="noopener noreferrer">Information ↗</a>
          <button class="info-btn" id="experiment-btn-top" style="background:none;border:none;font-family:inherit;padding:0;">Experiment ↗</button>
        </div>
      </div>
      <nav class="cat-nav" id="cat-nav">
        <button data-cat="" class="on">All</button>
        <button data-cat="artdirecting">Art direction &amp; Brand identity</button>
        <button data-cat="interaction">Interaction</button>
        <button data-cat="uxui">UX/UI</button>
        <button data-cat="editorial">Editorial</button>
        <button data-cat="film">Film</button>
        <button data-cat="exhibition">Exhibition</button>
      </nav>
    </div>
    <div class="project-list" id="project-list">
      <div style="padding:20px;color:#ccc;">Loading&#8230;</div>
    </div>
  </div>
  <div class="right" id="right">
    <div id="r-grid"></div>
    <div id="r-experiment"></div>
    <div id="r-detail"></div>
  </div>
</div>

<script>
let lastStar = 0;
document.addEventListener('mousemove', function(e) {
  const now = Date.now();
  if (now - lastStar < 50) return;
  lastStar = now;
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'star'); s.setAttribute('width', '12'); s.setAttribute('height', '12'); s.setAttribute('viewBox', '0 0 24 24');
  s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('fill', '#FF6FD6');
  p.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z');
  s.appendChild(p); document.body.appendChild(s);
  setTimeout(function() { s.remove(); }, 1000);
});

let projects = [], experimentProjects = [], activeCat = '', slideshowTimer = null, isExperimentMode = false;
const listEl = document.getElementById('project-list');
const catNav = document.getElementById('cat-nav');
const rightEl = document.getElementById('right');
const rGrid = document.getElementById('r-grid');
const rExperiment = document.getElementById('r-experiment');
const rDetail = document.getElementById('r-detail');

function clearSlideshowTimer() { if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; } }
function hideAll() { rGrid.classList.remove('on'); rDetail.classList.remove('on'); rExperiment.classList.remove('on'); clearSlideshowTimer(); }

function renderExperiment() {
  if (!experimentProjects.length) { rExperiment.innerHTML = '<div style="padding:20px;color:#ccc;">No experiments</div>'; return; }
  rExperiment.innerHTML = '<div class="exp-grid">' + experimentProjects.map(function(p) {
    var size = p.size || 'medium';
    var thumb = '';
    if (p.thumbnail && p.thumbnail.src) {
      if (p.thumbnail.type === 'video') {
        thumb = '<video autoplay loop muted playsinline><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
      } else {
        thumb = '<img src="' + p.thumbnail.src + '" alt="' + (p.title||'') + '">';
      }
    }
    return '<div class="exp-card size-' + size + '" data-id="' + p.id + '">' +
      '<div class="exp-thumb">' + thumb + '</div>' +
      '<div class="exp-card-info"><div class="exp-card-title">' + (p.title||'') + '</div><div class="exp-card-type">' + (p.type||'') + '</div></div>' +
    '</div>';
  }).join('') + '</div>';
  rExperiment.querySelectorAll('.exp-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var proj = experimentProjects.find(function(p) { return p.id === card.dataset.id; });
      if (proj) openDetail(proj);
    });
  });
}

function renderExperimentList() {
  if (!experimentProjects.length) { listEl.innerHTML = '<div style="padding:20px;color:#ccc;">No experiments</div>'; return; }
  listEl.innerHTML = experimentProjects.map(function(p) {
    return '<a class="proj-row" data-id="' + p.id + '" href="#"><div class="proj-title">' + (p.title||'') + '</div><div class="proj-type">' + (p.type||'') + '</div></a>';
  }).join('');
  listEl.querySelectorAll('.proj-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      e.preventDefault();
      var proj = experimentProjects.find(function(p) { return p.id === row.dataset.id; });
      if (!proj) return;
      listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
      row.classList.add('on');
      openDetail(proj);
    });
  });
}

function showExperiment() {
  hideAll();
  isExperimentMode = true;
  renderExperiment();
  renderExperimentList();
  rExperiment.classList.add('on');
  rightEl.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderThumb(p) {
  if (!p.thumbnail || !p.thumbnail.src) return '';
  if (p.thumbnail.type === 'video') return '<video autoplay loop muted playsinline preload="metadata"><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
  return '<img src="' + p.thumbnail.src + '" alt="' + (p.title || '') + '">';
}

function renderGrid(list) {
  if (!list.length) { rGrid.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>'; return; }
  rGrid.innerHTML = '<div class="thumb-grid">' + list.map(function(p) {
    const isExt = !!p.externalUrl;
    const href = isExt ? p.externalUrl : '#';
    const attrs = isExt ? 'target="_blank" rel="noopener noreferrer"' : 'data-id="' + p.id + '"';
    return '<a class="thumb-card" href="' + href + '" ' + attrs + '><div class="thumb-media">' + renderThumb(p) + '</div><div class="thumb-info"><div class="thumb-title">' + (p.title||'') + '</div><div class="thumb-type">' + (p.type||'') + '</div></div></a>';
  }).join('') + '</div>';
  rGrid.querySelectorAll('.thumb-card[data-id]').forEach(function(card) {
    card.addEventListener('click', function(e) {
      e.preventDefault();
      const proj = projects.find(function(p) { return p.id === card.dataset.id; });
      if (proj) openDetail(proj);
    });
  });
}

function renderList(list) {
  if (!list.length) { listEl.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>'; return; }
  listEl.innerHTML = list.map(function(p) {
    return '<a class="proj-row" data-id="' + p.id + '" href="#"><div class="proj-title">' + (p.title||'') + '</div><div class="proj-type">' + (p.type||'') + '</div></a>';
  }).join('');
  listEl.querySelectorAll('.proj-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      e.preventDefault();
      const proj = projects.find(function(p) { return p.id === row.dataset.id; });
      if (!proj) return;
      if (proj.externalUrl) { window.open(proj.externalUrl, '_blank', 'noopener,noreferrer'); return; }
      listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
      row.classList.add('on');
      openDetail(proj);
    });
  });
}

function showGrid(list, fromPop) {
  hideAll(); renderGrid(list); rGrid.classList.add('on');
  rightEl.scrollTo({ top: 0, behavior: 'smooth' });
  listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
  if (!fromPop) history.pushState({ view: 'grid', cat: activeCat }, '');
}

function renderSlideshow(slides) {
  if (!slides || !slides.length) return '';
  const imgs = slides.map(function(s, i) {
    return '<img src="' + s.src + '" alt="slide ' + (i+1) + '" class="' + (i === 0 ? 'active' : '') + '">';
  }).join('');
  return '<div class="slideshow" id="slideshow">' +
    '<button class="slide-btn prev" id="slide-prev">&#8592;</button>' +
    '<div class="slideshow-track" id="slide-track">' + imgs + '</div>' +
    '<button class="slide-btn next" id="slide-next">&#8594;</button>' +
  '</div>';
}

function initSlideshow(total) {
  if (!total) return;
  let cur = 0;
  const track = document.getElementById('slide-track');
  if (!track) return;
  const imgs = track.querySelectorAll('img');
  function goTo(n) {
    imgs[cur].classList.remove('active');
    cur = (n + total) % total;
    imgs[cur].classList.add('active');
  }
  function startAuto() {
    clearSlideshowTimer();
    slideshowTimer = setInterval(function() { goTo(cur + 1); }, 4000);
  }
  document.getElementById('slide-prev').addEventListener('click', function() { clearSlideshowTimer(); goTo(cur - 1); startAuto(); });
  document.getElementById('slide-next').addEventListener('click', function() { clearSlideshowTimer(); goTo(cur + 1); startAuto(); });
  startAuto();
}

function renderMediaItem(m, title) {
  if (m.type === 'video') return '<video autoplay loop muted playsinline><source src="' + m.src + '" type="video/mp4"></video>';
  if (m.type === 'vimeo') return '<div class="vimeo-box"><iframe src="https://player.vimeo.com/video/' + m.id + '?autoplay=0&title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
  if (m.type === 'youtube') return '<div class="vimeo-box"><iframe src="https://www.youtube.com/embed/' + m.id + '" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
  if (m.type === 'image') return '<img src="' + m.src + '" alt="' + (title||'') + '">';
  return '';
}

function openDetail(p, fromPop) {
  hideAll(); rDetail.classList.add('on');
  if (!fromPop) history.pushState({ view: 'detail', id: p.id, cat: activeCat }, '');
  const desc = p.description && p.description.en ? p.description.en : '';
  const metaParts = [p.type, p.date, p.client].filter(Boolean);
  const embedHTML = p.embedUrl ? '<iframe class="embed-box" src="' + p.embedUrl + '" allow="fullscreen"></iframe>' : '';
  const media = p.media || [];
  const insertAt = (p.slides && p.slides.length && p.slideshowPosition != null) ? p.slideshowPosition : -1;

  var galleryHTML = '';
  if (insertAt >= 0) {
    var before = media.slice(0, insertAt).map(function(m) { return renderMediaItem(m, p.title); }).join('');
    var after  = media.slice(insertAt).map(function(m) { return renderMediaItem(m, p.title); }).join('');
    galleryHTML = embedHTML + before + '</div>' + renderSlideshow(p.slides) + '<div class="gallery">' + after;
  } else {
    galleryHTML = embedHTML + media.map(function(m) { return renderMediaItem(m, p.title); }).join('');
  }

  rDetail.innerHTML =
    '<div class="d-header">' +
      '<div class="d-left">' +
        '<div class="d-title">' + (p.title||'') + '</div>' +
        '<div class="d-meta">' + metaParts.join(' · ') + '</div>' +
        '<div class="d-collab">' + (p.collaboration||'') + '</div>' +
      '</div>' +
      (desc ? '<div class="d-desc">' + desc + '</div>' : '<div></div>') +
    '</div>' +
    '<div class="gallery">' + galleryHTML + '</div>' +
    (p.sections && p.sections.length ? '<div class="d-sections">' + p.sections.map(function(s) {
      var sMediaHTML = (s.media || []).map(function(m) { return renderMediaItem(m, s.title); }).join('');
      var sEmbedHTML = s.embedUrl ? '<iframe src="' + s.embedUrl + '" style="width:100%;height:100vh;border:none;display:block;margin-top:10px;" allow="fullscreen"></iframe>' : '';
      var sSlidesHTML = (s.slides && s.slides.length) ? (function() {
        var sid = 'slide-track-' + Math.random().toString(36).substr(2,5);
        var imgs = s.slides.map(function(sl, i) { return '<img src="' + sl.src + '" alt="slide ' + (i+1) + '" class="' + (i===0?'active':'') + '">'; }).join('');
        setTimeout(function() {
          var el = document.getElementById(sid);
          if (!el) return;
          var imgs2 = el.querySelectorAll('img'); var cur = 0; var total = imgs2.length;
          function goTo(n) { imgs2[cur].classList.remove('active'); cur=(n+total)%total; imgs2[cur].classList.add('active'); }
          el.parentNode.querySelector('.s-prev').addEventListener('click', function(){ goTo(cur-1); });
          el.parentNode.querySelector('.s-next').addEventListener('click', function(){ goTo(cur+1); });
          setInterval(function(){ goTo(cur+1); }, 4000);
        }, 100);
        return '<div class="slideshow" style="margin-top:10px;"><button class="slide-btn prev s-prev">&#8592;</button><div class="slideshow-track" id="' + sid + '">' + imgs + '</div><button class="slide-btn next s-next">&#8594;</button></div>';
      })() : '';
      return '<div class="d-section-wrap">' +
        '<div class="d-section"><div class="d-section-title">' + (s.title||'') + '</div><div class="d-section-desc">' + (s.desc||'') + '</div></div>' +
        (sEmbedHTML ? sEmbedHTML : '') +
        sSlidesHTML +
        (sMediaHTML ? '<div class="gallery">' + sMediaHTML + '</div>' : '') +
        '</div>';
    }).join('') + '</div>' : '');

  if (p.slides && p.slides.length) initSlideshow(p.slides.length);
  rightEl.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('popstate', function(e) {
  const state = e.state;
  if (!state || state.view === 'grid') {
    const cat = state ? (state.cat || '') : '';
    activeCat = cat;
    const filtered = cat ? projects.filter(function(p) { return (p.category||'').toLowerCase() === cat; }) : projects;
    catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
    catNav.querySelector('[data-cat="' + cat + '"]').classList.add('on');
    renderList(filtered); showGrid(filtered, true);
  } else if (state.view === 'detail') {
    const proj = projects.find(function(p) { return p.id === state.id; });
    listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
    const activeRow = listEl.querySelector('.proj-row[data-id="' + state.id + '"]');
    if (activeRow) activeRow.classList.add('on');
    if (proj) openDetail(proj, true);
  }
});

document.getElementById('logo-link').addEventListener('click', function(e) {
  e.preventDefault();
  catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
  catNav.querySelector('[data-cat=""]').classList.add('on');
  activeCat = ''; renderList(projects); showGrid(projects);
});

catNav.querySelectorAll('button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
    btn.classList.add('on'); activeCat = btn.dataset.cat;
    const filtered = activeCat ? projects.filter(function(p) { return (p.category||'').toLowerCase() === activeCat; }) : projects;
    renderList(filtered); showGrid(filtered);
  });
});

fetch('./experiment-data.json', { cache: 'no-store' })
  .then(function(r) { return r.ok ? r.json() : { projects: [] }; })
  .then(function(data) { experimentProjects = data.projects || []; })
  .catch(function() { experimentProjects = []; });

document.getElementById('experiment-btn-top').addEventListener('click', function() {
  catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
  showExperiment();
});

fetch('./projects-data.json', { cache: 'no-store' })
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    projects = data.projects || [];
    renderList(projects);
    history.replaceState({ view: 'grid', cat: '' }, '');
    showGrid(projects, true);
  })
  .catch(function(err) {
    console.error(err);
    listEl.innerHTML = '<div style="padding:20px;color:red;">Failed to load: ' + err.message + '</div>';
  });
</script>
</body>
</html>
