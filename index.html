<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaelin Kim</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #FF6FD6; --gray: #999; --line: #e8e8e8; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
      font-size: 13px; line-height: 1.5; background: #fff; color: #000;
      -webkit-font-smoothing: antialiased;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23FF6FD6" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, auto;
    }
    a { text-decoration: none; color: inherit; }

    /* ─── LANDING: 3-column ─── */
    .layout-landing {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── DETAIL: 2-column ─── */
    .layout-detail {
      display: none;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .layout-detail.on { display: grid; }

    /* ===== LEFT (공통) ===== */
    .col-left {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 32px 28px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .col-left::-webkit-scrollbar { width: 0; }
    .left-spacer { flex: 1; }
    .logo-wrap {
      width: 110px;
      height: 62px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .logo-wrap video { width: 136px; margin-left: -13px; }
    .left-name {
      font-size: 14px;
      font-weight: 700;
      color: #000;
      margin-bottom: 8px;
    }
    .left-desc {
      font-size: 12px;
      color: var(--gray);
      line-height: 1.6;
      margin-bottom: 0;
    }
    .left-section { margin-bottom: 20px; }
    .left-link {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #000;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: color 0.15s;
      line-height: 1.8;
    }
    .left-link:hover { color: var(--pink); }

    /* ─── 디테일 모드 왼쪽: 프로젝트 패널 ─── */
    .detail-left-panel {
      display: none;
      flex-direction: column;
      gap: 0;
    }
    .detail-left-panel.on { display: flex; }

    .dlp-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #666;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 20px;
      background: #f0f0f0;
      border: none;
      font-family: inherit;
      padding: 6px 14px;
      border-radius: 999px;
      text-align: left;
      width: fit-content;
    }
    .dlp-back:hover { background: #e4e4e4; color: #000; }

    .dlp-title {
      font-size: 13px;
      font-weight: 700;
      color: #000;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .dlp-meta {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .dlp-desc {
      font-size: 11px;
      color: #555;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    /* 디테일 오른쪽 섹션 블록 */
    .detail-section-block {
      margin-bottom: 8px;
      margin-top: 24px;
    }
    .detail-section-block .dlp-section-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .detail-section-block .dlp-section-text {
      font-size: 13px;
      color: #555;
      line-height: 1.65;
    }

    /* 디테일 왼쪽 섹션들 */
    .dlp-sections { display: flex; flex-direction: column; gap: 16px; }
    .dlp-section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 5px;
    }
    .dlp-section-text {
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }

    /* 왼쪽 소형 썸네일 그리드 */
    .dlp-thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 20px;
    }
    .dlp-thumb {
      aspect-ratio: 3/2;
      overflow: hidden;
      background: #f5f5f5;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
    }
    .dlp-thumb img,
    .dlp-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dlp-thumb.active { outline: 2px solid #000; outline-offset: -2px; }

    /* ===== MIDDLE: 프로젝트 목록 ===== */
    .col-mid {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      border-right: none;
    }
    .col-mid::-webkit-scrollbar { width: 0; }

    .proj-item {
      display: block;
      padding: 6px 0;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: opacity 0.1s;
      text-decoration: none;
      color: inherit;
    }
    .proj-item * { cursor: inherit !important; }
    .proj-item:hover { opacity: 0.7; }
    .proj-item.hovered { opacity: 0.7; }

    .proj-item-thumb {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #f5f5f5;
    }
    .proj-item-thumb img,
    .proj-item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .proj-item-info { display: none; }

    /* ===== RIGHT: 호버 프리뷰 ===== */
    .col-right {
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    .preview-empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ddd;
      font-size: 12px;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .preview-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      padding: 32px;
    }
    .preview-wrap.on { opacity: 1; }
    .preview-media { max-width: 420px; width: 100%; }
    .preview-media img,
    .preview-media video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .preview-info { text-align: left; }
    .preview-info-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; color: #000; }
    .preview-info-type { font-size: 11px; color: var(--gray); }

    /* ===== DETAIL RIGHT: 미디어 그리드 ===== */
    .col-detail-right {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 32px 32px 60px;
    }
    .col-detail-right::-webkit-scrollbar { width: 0; }

    /* 미디어 1컬럼 */
    .detail-media-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .detail-media-item img,
    .detail-media-item video {
      width: 100%;
      height: auto;
      display: block;
    }
    .vimeo-box {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .vimeo-box iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* ===== 비밀번호 모달 ===== */
    .pw-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .pw-modal.on { display: flex; }
    .pw-box {
      background: #fff;
      padding: 28px 24px 24px;
      width: 300px;
      border-radius: 4px;
    }
    .pw-box p { font-size: 13px; color: #000; margin-bottom: 16px; font-weight: 600; }
    .pw-box input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      margin-bottom: 8px;
    }
    .pw-box input:focus { border-color: #000; }
    .pw-error { font-size: 11px; color: #ff4444; min-height: 16px; margin-bottom: 12px; }
    .pw-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .pw-btns button {
      background: none; border: 1px solid var(--line);
      padding: 6px 16px; font-size: 12px;
      font-family: inherit; border-radius: 2px;
      cursor: pointer; transition: background 0.1s;
    }
    .pw-btns button.confirm { background: #000; color: #fff; border-color: #000; }
    .pw-btns button:hover { opacity: 0.8; }

    /* ===== 별 커서 트레일 ===== */
    .star { position: fixed; pointer-events: none; z-index: 99999; animation: starfall 1s ease-in forwards; }
    @keyframes starfall {
      from { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      to   { transform: translateY(100px) rotate(180deg) scale(0); opacity: 0; }
    }

    /* ===== Experiment 뷰 (2컬럼) ===== */
    .layout-experiment {
      display: none;
      grid-template-columns: 220px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .layout-experiment.on { display: grid; }

    .exp-col-left {
      display: flex;
      flex-direction: column;
      padding: 32px 28px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .exp-col-left::-webkit-scrollbar { width: 0; }
    .exp-back { cursor: url("cursor-hand.png") 16 16, pointer !important; }

    /* 탭 네비 */
    .exp-tab-nav {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
    }
    .exp-tab-wrap {
      position: relative;
    }
    .exp-tab {
      background: none; border: none; font-family: inherit;
      font-size: 13px; font-weight: 700; color: #bbb;
      padding: 0; cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: color 0.15s;
    }
    .exp-tab.active { color: #000; }
    .exp-tab:hover { color: #000; }

    /* 카테고리 드롭다운 */
    .exp-cat-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 6px 0;
      z-index: 100;
      min-width: 160px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .exp-tab-wrap:hover .exp-cat-dropdown { display: block; }
    .exp-cat-item {
      display: block; width: 100%;
      background: none; border: none; font-family: inherit;
      font-size: 12px; color: #555; text-align: left;
      padding: 7px 16px;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: background 0.1s, color 0.1s;
    }
    .exp-cat-item:hover { background: #f5f5f5; color: #000; }
    .exp-cat-item.active { font-weight: 700; color: #000; }

    .exp-col-mid {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
    }
    .exp-col-mid::-webkit-scrollbar { width: 0; }

    .exp-col-right {
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    #exp-preview-empty {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ddd; font-size: 12px;
      user-select: none; pointer-events: none;
      transition: opacity 0.25s;
    }

    .exp-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #666;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 20px;
      background: #f0f0f0;
      border: none;
      font-family: inherit;
      padding: 6px 14px;
      border-radius: 999px;
      text-align: left;
      width: fit-content;
    }
    .exp-back:hover { background: #e4e4e4; color: #000; }
    .exp-label {
      font-size: 14px;
      font-weight: 700;
      color: #000;
    }

    .exp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .exp-card {
      break-inside: avoid;
      cursor: url("cursor-hand.png") 16 16, pointer !important;
    }
    .exp-card:hover { opacity: 0.8; }
    .exp-thumb { overflow: hidden; background: #f5f5f5; }
    .exp-thumb img,
    .exp-thumb video { width: 100%; height: auto; display: block; object-fit: cover; }
    .exp-card-info { padding: 6px 0 2px; }
    .exp-card-title { font-size: 12px; font-weight: 600; }
    .exp-card-type { font-size: 11px; color: var(--gray); }

    /* ===== 모바일 ===== */
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .layout-landing {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: 100vh;
      }
      .layout-detail {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }
      .col-left {
        flex-direction: column;
        height: auto;
        padding: 20px;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .col-right { display: none; }
      .col-mid { height: auto; overflow-y: visible; }
      .col-detail-right { height: auto; padding: 20px; }
      .detail-media-grid { columns: 1; }
    }
  </style>
</head>
<body>

<!-- ══════════════ LANDING (3-column) ══════════════ -->
<div class="layout-landing" id="layout-landing">
  <!-- LEFT -->
  <div class="col-left">
    <div class="left-name">Chaelin Kim</div>
    <div class="left-desc">Communication Designer<br>Brand identity, interaction, editorial &amp; graphic design.</div>

          <button class="work-cat-item" data-cat="all" style="display:block;width:100%;background:none;border:none;font-family:inherit;font-size:12px;color:#555;text-align:left;padding:7px 16px;cursor:pointer;">All</button>

          <button class="work-cat-item" data-cat="uxui" style="display:block;width:100%;background:none;border:none;font-family:inherit;font-size:12px;color:#555;text-align:left;padding:7px 16px;cursor:pointer;">UX/UI</button>
          <button class="work-cat-item" data-cat="Editorial" style="display:block;width:100%;background:none;border:none;font-family:inherit;font-size:12px;color:#555;text-align:left;padding:7px 16px;cursor:pointer;">Editorial</button>
          <button class="work-cat-item" data-cat="Film" style="display:block;width:100%;background:none;border:none;font-family:inherit;font-size:12px;color:#555;text-align:left;padding:7px 16px;cursor:pointer;">Film</button>
          <button class="work-cat-item" data-cat="Interaction" style="display:block;width:100%;background:none;border:none;font-family:inherit;font-size:12px;color:#555;text-align:left;padding:7px 16px;cursor:pointer;">Interaction</button>
        </div>
      </div>
      <button id="experiment-btn" class="left-link" style="background:none;border:none;font-family:inherit;padding:0;font-size:12px;font-weight:700;text-align:left;">Experiment ↗</button>

    <div class="left-spacer"></div>
    <div class="logo-wrap" style="margin-bottom:0;">
      <video autoplay loop muted playsinline><source src="logo.mp4" type="video/mp4"></video>
    </div>
  </div>

  <!-- MIDDLE: 프로젝트 목록 -->
  <div class="col-mid">
    <div id="project-list">
      <div style="padding:20px;color:#ccc;">Loading&#8230;</div>
    </div>
  </div>

  <!-- RIGHT: 호버 프리뷰 -->
  <div class="col-right" id="col-right">
    <div class="preview-empty" id="preview-empty">—</div>
    <div class="preview-wrap" id="preview-wrap">
      <div class="preview-media" id="preview-media">
        <video id="preview-video" autoplay loop muted playsinline style="display:none;"></video>
        <img id="preview-img" alt="" style="display:none;">
      </div>
      <div class="preview-info">
        <div class="preview-info-title" id="preview-title"></div>
        <div class="preview-info-type" id="preview-type"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ EXPERIMENT (3-column) ══════════════ -->
<div class="layout-experiment" id="layout-experiment">
  <!-- LEFT -->
  <div class="exp-col-left">
    <div class="left-name">Chaelin Kim</div>
    <div class="left-desc">Communication Designer<br>Brand identity, interaction, editorial &amp; graphic design.</div>
    <div class="left-section" style="margin-top:20px;">
      <a class="left-link" href="mailto:linworkingon@gmail.com">Email ↗</a>

      <a class="left-link" href="https://www.linkedin.com/in/chaelinkim201" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>

    <div class="left-spacer"></div>
    <div class="logo-wrap" style="margin-bottom:0;">
      <video autoplay loop muted playsinline><source src="logo.mp4" type="video/mp4"></video>
    </div>
  </div>

  <div class="exp-col-mid">
    <div class="exp-grid" id="work-grid"></div>
    <div class="exp-grid" id="exp-grid" style="display:none;"></div>
  </div>
  <!-- RIGHT: hover 프리뷰 (숨김) -->
  <div class="exp-col-right" id="exp-col-right" style="display:none;">
    <div class="preview-empty" id="exp-preview-empty">—</div>
    <div class="preview-wrap" id="exp-preview-wrap">
      <div class="preview-media">
        <video id="exp-preview-video" autoplay loop muted playsinline style="display:none;"></video>
        <img id="exp-preview-img" alt="" style="display:none;">

      <div class="preview-info">

<!-- ══════════════ DETAIL (2-column, 프로젝트 열렸을 때) ══════════════ -->
<div class="layout-detail" id="layout-detail">
  <!-- LEFT: 텍스트 패널 -->
  <div class="col-left" id="detail-col-left">
    <div class="logo-wrap" style="cursor:pointer;display:none;" id="detail-logo">

    <div class="detail-left-panel on" id="detail-left-panel">
      <button class="dlp-back" id="dlp-back" style="margin-top:0;">← Back</button>
      <div class="dlp-title" id="dlp-title"></div>
      <div class="dlp-meta" id="dlp-meta"></div>
      <div class="dlp-desc" id="dlp-desc"></div>
      <div class="dlp-sections" id="dlp-sections"></div>
      <div class="dlp-thumbs" id="dlp-thumbs"></div>
    </div>

  <!-- RIGHT: 대형 미디어 그리드 -->
  <div class="col-detail-right" id="col-detail-right">
    <div class="detail-media-grid" id="detail-media-grid"></div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div class="pw-modal" id="pw-modal">
  <div class="pw-box">
    <p>Password required</p>
    <input type="password" id="pw-input" placeholder="Enter password">
    <div class="pw-error" id="pw-error"></div>
    <div class="pw-btns">
      <button id="pw-cancel">Cancel</button>
      <button class="confirm" id="pw-confirm">Enter</button>
    </div>
  </div>
</div>

<script>
// ── 별 커서 트레일
var lastStar = 0;
document.addEventListener('mousemove', function(e) {
  var now = Date.now();
  if (now - lastStar < 50) return;
  lastStar = now;
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'star');
  s.setAttribute('width', '12'); s.setAttribute('height', '12'); s.setAttribute('viewBox', '0 0 24 24');
  s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('fill', '#FF6FD6');
  p.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z');
  s.appendChild(p); document.body.appendChild(s);
  setTimeout(function() { s.remove(); }, 1000);
});

// ── DOM refs
var layoutLanding = document.getElementById('layout-landing');
var layoutDetail  = document.getElementById('layout-detail');
var projectListEl = document.getElementById('project-list');
var previewWrap   = document.getElementById('preview-wrap');
var previewEmpty  = document.getElementById('preview-empty');
var previewVideo  = document.getElementById('preview-video');
var previewImg    = document.getElementById('preview-img');
var previewTitle  = document.getElementById('preview-title');
var previewType   = document.getElementById('preview-type');

var dlpTitle    = document.getElementById('dlp-title');
var dlpMeta     = document.getElementById('dlp-meta');
var dlpDesc     = document.getElementById('dlp-desc');
var dlpSections = document.getElementById('dlp-sections');
var dlpThumbs   = document.getElementById('dlp-thumbs');
var detailGrid  = document.getElementById('detail-media-grid');
var colDetailRight = document.getElementById('col-detail-right');

var projects = [], experimentProjects = [], allProjects = [];
var previewTimeout = null;
var pwPendingProject = null;
var pwModal   = document.getElementById('pw-modal');
var pwInput   = document.getElementById('pw-input');
var pwError   = document.getElementById('pw-error');

var layoutExperiment = document.getElementById('layout-experiment');

// ── 뷰 전환
function hideAll() {
  layoutLanding.style.display = 'none';
  layoutDetail.classList.remove('on');
  layoutExperiment.classList.remove('on');
}

function showLanding() {
  hideAll();
  layoutLanding.style.display = 'grid';
}

function showDetail(p) {
  hideAll();
  layoutDetail.classList.add('on');
  buildDetail(p);
  colDetailRight.scrollTo({ top: 0 });
  document.getElementById('detail-col-left').scrollTo({ top: 0 });
}

function showExperimentView() {
  hideAll();
  layoutExperiment.classList.add('on');
  buildExperiment();
  document.getElementById('exp-col-right') && document.querySelector('.exp-col-right').scrollTo({ top: 0 });
}

// ── 호버 프리뷰
function showPreview(proj) {
  if (previewTimeout) { clearTimeout(previewTimeout); previewTimeout = null; }
  var thumb = proj.thumbnail;
  if (!thumb || !thumb.src) return;
  if (thumb.type === 'video') {
    if (previewVideo.getAttribute('data-src') !== thumb.src) {
      previewVideo.src = thumb.src;
      previewVideo.setAttribute('data-src', thumb.src);
    }
    previewVideo.style.display = 'block';
    previewImg.style.display = 'none';
  } else {
    previewImg.src = thumb.src;
    previewImg.style.display = 'block';
    previewVideo.style.display = 'none';
    previewVideo.src = ''; previewVideo.removeAttribute('data-src');
  }
  previewTitle.textContent = proj.title || '';
  previewType.textContent  = proj.type  || '';
  previewWrap.classList.add('on');
  previewEmpty.style.opacity = '0';
}

function hidePreview() {
  previewTimeout = setTimeout(function() {
    previewWrap.classList.remove('on');
    previewEmpty.style.opacity = '1';
    setTimeout(function() {
      if (!previewWrap.classList.contains('on')) {
        previewVideo.src = ''; previewVideo.removeAttribute('data-src');
        previewImg.src = '';
      }
    }, 300);
  }, 80);
}

// ── 썸네일 렌더 (목록용)
function renderThumb(p) {
  if (!p.thumbnail || !p.thumbnail.src) return '';
  if (p.thumbnail.type === 'video') {
    return '<video autoplay loop muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;"><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
  }
  return '<img src="' + p.thumbnail.src + '" alt="' + (p.title || '') + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
}

// ── 미디어 아이템 HTML (디테일용)
function renderMediaItem(m, title) {
  if (m.type === 'video') {
    return '<div class="detail-media-item"><video autoplay loop muted playsinline><source src="' + m.src + '" type="video/mp4"></video></div>';
  }
  if (m.type === 'vimeo') {
    return '<div class="detail-media-item"><div class="vimeo-box"><iframe src="https://player.vimeo.com/video/' + m.id + '?autoplay=0&title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>';
  }
  if (m.type === 'youtube') {
    return '<div class="detail-media-item"><div class="vimeo-box"><iframe src="https://www.youtube.com/embed/' + m.id + '" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>';
  }
  if (m.type === 'image') {
    return '<div class="detail-media-item"><img src="' + m.src + '" alt="' + (title || '') + '"></div>';
  }
  return '';
}

// ── 디테일 빌드
function buildDetail(p) {
  // 왼쪽 패널
  dlpTitle.textContent = p.title || '';

  var metaParts = [p.type, p.date, p.client].filter(Boolean);
  dlpMeta.textContent = metaParts.join(' · ');

  var desc = p.description && p.description.en ? p.description.en : (p.description || '');
  dlpDesc.textContent = desc;
  dlpDesc.style.display = desc ? '' : 'none';

  // 섹션 텍스트는 오른쪽에 표시 (왼쪽 패널 비움)
  dlpSections.innerHTML = '';

  // 소형 썸네일 그리드 (전체 미디어 overview)
  var allMedia = [];
  if (p.thumbnail && p.thumbnail.src) allMedia.push(p.thumbnail);
  if (p.media) p.media.forEach(function(m) { if (m.src || m.id) allMedia.push(m); });
  if (p.sections) p.sections.forEach(function(s) { if (s.media) s.media.forEach(function(m) { if (m.src) allMedia.push(m); }); });

  dlpThumbs.innerHTML = '';
  allMedia.slice(0, 9).forEach(function(m, i) {
    var div = document.createElement('div');
    div.className = 'dlp-thumb' + (i === 0 ? ' active' : '');
    if (m.type === 'video' && m.src) {
      div.innerHTML = '<video autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;display:block;"><source src="' + m.src + '" type="video/mp4"></video>';
    } else if (m.src) {
      div.innerHTML = '<img src="' + m.src + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">';
    } else {
      div.style.background = '#eee';
    }
    dlpThumbs.appendChild(div);
  });

  // 오른쪽 대형 미디어 + 섹션 텍스트
  var html = '';
  if (p.embedUrl) {
    html += '<div class="vimeo-box"><iframe src="' + p.embedUrl + '" allow="fullscreen"></iframe></div>';
  }
  var media = p.media || [];
  media.forEach(function(m) { html += renderMediaItem(m, p.title); });
  if (p.sections) {
    p.sections.forEach(function(s) {
      // 섹션 텍스트 (label + desc)
      if (s.title || s.desc) {
        html += '<div class="detail-section-block">';
        if (s.title) html += '<div class="dlp-section-label">' + s.title + '</div>';
        if (s.desc) html += '<div class="dlp-section-text">' + s.desc + '</div>';
        html += '</div>';
      }
      // 섹션 미디어
      if (s.media) s.media.forEach(function(m) { html += renderMediaItem(m, s.title || p.title); });
      if (s.embedUrl) html += '<div class="vimeo-box"><iframe src="' + s.embedUrl + '" allow="fullscreen"></iframe></div>';
    });
  }
  detailGrid.innerHTML = html;
}

var expViewBuilt = false;

function makeThumb(p) {
  if (!p.thumbnail || !p.thumbnail.src) return '';
  if (p.thumbnail.type === 'video') {
    return '<video autoplay loop muted playsinline><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
  }
  return '<img src="' + p.thumbnail.src + '" alt="' + (p.title||'') + '">';
}

function makeCard(p, dataAttr) {
  return '<div class="exp-card" data-id="' + p.id + '" ' + (dataAttr||'') + '>' +
    '<div class="exp-thumb">' + makeThumb(p) + '</div>' +
    '<div class="exp-card-info"><div class="exp-card-title">' + (p.title||'') + '</div><div class="exp-card-type">' + (p.type||'') + '</div></div>' +
  '</div>';
}

function attachCardEvents(grid, projects, usePreview) {
  var epWrap  = document.getElementById('exp-preview-wrap');
  var epEmpty = document.getElementById('exp-preview-empty');
  var epVideo = document.getElementById('exp-preview-video');
  var epImg   = document.getElementById('exp-preview-img');
  var epTitle = document.getElementById('exp-preview-title');
  var epType  = document.getElementById('exp-preview-type');

  grid.querySelectorAll('.exp-card').forEach(function(card) {
    var proj = projects.find(function(p) { return p.id === card.dataset.id; });
    if (!proj) return;
    if (usePreview) {
      card.addEventListener('mouseenter', function() {
        var thumb = proj.thumbnail;
        if (!thumb || !thumb.src) return;
        if (thumb.type === 'video') {
          epVideo.src = thumb.src; epVideo.style.display = 'block'; epImg.style.display = 'none';
        } else {
          epImg.src = thumb.src; epImg.style.display = 'block'; epVideo.style.display = 'none';
        }
        epTitle.textContent = proj.title || '';
        epType.textContent  = proj.type  || '';
        epWrap.classList.add('on');
        epEmpty.style.opacity = '0';
      });
      card.addEventListener('mouseleave', function() {
        epWrap.classList.remove('on');
        epEmpty.style.opacity = '1';
      });
    }
    card.addEventListener('click', function() { openProject(proj); });
  });
}

// ── Work 그리드 필터
var currentCat = 'all';
function buildWorkGrid(cat) {
  var grid = document.getElementById('work-grid');
  var filtered = cat === 'all' ? allProjects : allProjects.filter(function(p) { return p.category === cat; });
  grid.innerHTML = filtered.map(function(p) { return makeCard(p); }).join('');
  attachCardEvents(grid, allProjects, false);
  // 카테고리 버튼 active 표시
  document.querySelectorAll('.exp-cat-item').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  currentCat = cat;
}

// ── Experiment 그리드
function buildExperimentGrid() {
  var grid = document.getElementById('exp-grid');
  if (expViewBuilt) return;
  if (!experimentProjects.length) {
    grid.innerHTML = '<div style="color:#ccc;padding:20px;">No experiments yet</div>';
    expViewBuilt = true; return;
  }
  grid.innerHTML = experimentProjects.map(function(p) { return makeCard(p); }).join('');
  attachCardEvents(grid, experimentProjects, false);
  expViewBuilt = true;
}

// ── 그리드 전환
function setExpTab(tab) {
  var workGrid = document.getElementById('work-grid');
  var expGrid  = document.getElementById('exp-grid');
  if (tab === 'work') {
    workGrid.style.display = ''; expGrid.style.display = 'none';
  } else {
    workGrid.style.display = 'none'; expGrid.style.display = '';
    buildExperimentGrid();
  }
}

// ── Work 뷰 초기화
function buildExperiment() {
  buildWorkGrid('all');
  setExpTab('work');
}

// ── Experiment 전용 뷰
function showWorkView(cat) {
  hideAll();
  layoutExperiment.classList.add('on');
  buildWorkGrid(cat || 'all');
  setExpTab('work');
}

function showExperimentOnlyView() {
  hideAll();
  layoutExperiment.classList.add('on');
  setExpTab('experiment');
}

// 카테고리 드롭다운 클릭
document.getElementById('cat-dropdown').addEventListener('click', function(e) {
  var btn = e.target.closest('.exp-cat-item');
  if (!btn) return;
  buildWorkGrid(btn.dataset.cat);
  setExpTab('work');
});

// (탭 버튼 제거됨)

// ── 프로젝트 열기
function openProject(p) {
  if (p.externalUrl) { window.open(p.externalUrl, '_blank', 'noopener,noreferrer'); return; }
  if (p.password) {
    pwPendingProject = p;
    pwModal.classList.add('on');
    setTimeout(function() { pwInput.focus(); }, 100);
    return;
  }
  showDetail(p);
}

// ── 비밀번호 모달
document.getElementById('pw-cancel').addEventListener('click', function() {
  pwModal.classList.remove('on');
  pwInput.value = ''; pwError.textContent = ''; pwPendingProject = null;
});
document.getElementById('pw-confirm').addEventListener('click', function() {
  if (pwInput.value === pwPendingProject.password) {
    pwModal.classList.remove('on');
    pwInput.value = ''; pwError.textContent = '';
    var p = pwPendingProject; pwPendingProject = null;
    showDetail(p);
  } else {
    pwError.textContent = 'Incorrect password.';
    pwInput.value = ''; pwInput.focus();
  }
});
pwInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('pw-confirm').click(); });

// ── 뒤로가기
document.getElementById('dlp-back').addEventListener('click', function() { showLanding(); });
document.getElementById('detail-logo').addEventListener('click', function() { showLanding(); });
document.getElementById('exp-back').addEventListener('click', function() { showLanding(); });

// ── Experiment 버튼
document.getElementById('experiment-btn').addEventListener('click', function() {
  showExperimentOnlyView();
});

// ── Work 버튼 (클릭으로 드롭다운 토글)
var workDropdown = document.getElementById('work-dropdown');
document.getElementById('work-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  var isOpen = workDropdown.style.display === 'block';
  if (isOpen) {
    workDropdown.style.display = 'none';
    showWorkView('all');
  } else {
    workDropdown.style.display = 'block';
  }
});
// 외부 클릭시 닫기
document.addEventListener('click', function() { workDropdown.style.display = 'none'; });

// 드롭다운 내부 클릭
workDropdown.addEventListener('click', function(e) {
  e.stopPropagation();
  var btn = e.target.closest('.work-cat-item');
  if (!btn) return;
  workDropdown.style.display = 'none';
  showWorkView(btn.dataset.cat);
});

// ── 랜딩: 목록 렌더
function renderList(list) {
  if (!list.length) { projectListEl.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>'; return; }
  projectListEl.innerHTML = list.map(function(p) {
    return '<a class="proj-item" href="#" data-id="' + p.id + '">' +
      '<div class="proj-item-thumb">' + renderThumb(p) + '</div>' +
      '<div class="proj-item-info">' +
        '<div class="proj-item-title">' + (p.title || '') + '</div>' +
        '<div class="proj-item-type">' + (p.type || '') + '</div>' +
      '</div>' +
    '</a>';
  }).join('');

  projectListEl.querySelectorAll('.proj-item').forEach(function(item) {
    var id = item.dataset.id;
    var proj = list.find(function(p) { return p.id === id; });
    if (!proj) return;

    item.addEventListener('mouseenter', function() {
      projectListEl.querySelectorAll('.proj-item').forEach(function(r) { r.classList.remove('hovered'); });
      item.classList.add('hovered');
      showPreview(proj);
    });
    item.addEventListener('mouseleave', function() {
      item.classList.remove('hovered');
      hidePreview();
    });
    item.addEventListener('click', function(e) {
      e.preventDefault();
      openProject(proj);
    });
  });
}

// ── 데이터 로드
fetch('./experiment-data.json', { cache: 'no-store' })
  .then(function(r) { return r.ok ? r.json() : { projects: [] }; })
  .then(function(data) { experimentProjects = data.projects || []; })
  .catch(function() { experimentProjects = []; });

fetch('./projects-data.json', { cache: 'no-store' })
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    projects = data.projects || [];
    allProjects = projects;
    renderList(projects);
  })
  .catch(function(err) {
    console.error(err);
    projectListEl.innerHTML = '<div style="padding:20px;color:red;">Failed to load: ' + err.message + '</div>';
  });
</script>
</body>
</html>
