<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaelin Kim</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #FF6FD6; --gray: #999; --line: #e8e8e8; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
      font-size: 13px; line-height: 1.5; background: #fff; color: #000;
      -webkit-font-smoothing: antialiased;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23FF6FD6" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, auto;
    }
    a { text-decoration: none; color: inherit; cursor: inherit; }

    /* ── DESKTOP LAYOUT ── */
    .layout { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
    .left { display: flex; flex-direction: column; height: 100vh; border-right: 1px solid var(--line); overflow: hidden; }
    .left-top { flex-shrink: 0; padding: 8px 20px 0; }
    .logo-wrap { width: 120px; height: 68px; overflow: hidden; margin-bottom: 16px; margin-top: 8px; }
    .logo-wrap a { display: block; cursor: url("cursor-hand.png") 16 16, pointer !important; }
    .logo-wrap a * { cursor: inherit !important; }
    .logo-wrap video { width: 148px; margin-left: -14px; }
    .info-btn { font-size: 13px; font-weight: 400; color: #000; cursor: url("cursor-hand.png") 16 16, pointer !important; transition: color 0.15s; }
    .info-btn:hover { color: var(--pink); }
    .cat-nav { display: flex; flex-wrap: wrap; gap: 1px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
    .cat-nav button { background: none; border: none; font-size: 13px; font-weight: 400; color: #000; cursor: url("cursor-hand.png") 16 16, pointer !important; padding: 2px 0; text-align: left; transition: color 0.15s; font-family: inherit; }
    .cat-nav button:hover, .cat-nav button.on { color: var(--pink); }
    .project-list { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 36px; border-top: 1px solid var(--line); }
    .project-list::-webkit-scrollbar { width: 0; }
    .proj-row { display: block; padding: 12px 20px; border-bottom: 1px solid var(--line); cursor: url("cursor-hand.png") 16 16, pointer !important; transition: background 0.1s; position: relative; }
    .proj-row * { cursor: inherit !important; }
    .proj-row:hover, .proj-row.on { background: #fafafa; }
    .proj-row:hover .proj-title, .proj-row.on .proj-title { color: var(--pink); }
    .proj-title { font-size: 17px; font-weight: 600; line-height: 1.4; transition: color 0.15s; margin-bottom: 2px; }
    .proj-type { font-size: 11px; color: var(--gray); }
    .lock-badge { position: absolute; top: 12px; right: 20px; font-size: 14px; opacity: 0.5; }
    .right { height: 100vh; overflow-y: auto; background: #fff; }
    .right::-webkit-scrollbar { width: 0; }
    #r-grid { display: none; padding: 20px; }
    #r-grid.on { display: block; }
    .thumb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .thumb-card { display: block; cursor: url("cursor-hand.png") 16 16, pointer !important; position: relative; }
    .thumb-card * { cursor: inherit !important; }
    .thumb-media { width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #f7f7f7; }
    .thumb-media img, .thumb-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-info { margin-top: 8px; margin-bottom: 4px; }
    .thumb-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; transition: color 0.15s; }
    .thumb-card:hover .thumb-title { color: var(--pink); }
    .thumb-type { font-size: 11px; color: var(--gray); }
    .thumb-lock-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
    #r-detail { display: none; padding: 44px 48px 100px; }
    #r-detail.on { display: block; }
    .d-header { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
    .d-left {}
    .d-title { font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
    .d-meta { font-size: 12px; color: var(--gray); margin-bottom: 3px; }
    .d-collab { font-size: 12px; color: var(--gray); margin-top: 16px; }
    .d-desc { font-size: 13px; line-height: 1.8; color: #333; }
    .d-sections { display: flex; flex-direction: column; margin-top: 40px; margin-bottom: 40px; }
    .d-section-wrap { border-top: 1px solid var(--line); padding-bottom: 32px; }
    .d-section-wrap:last-child { border-bottom: none; }
    .d-section { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 16px 0 16px; }
    .d-section-title { font-size: 13px; font-weight: 400; color: #000; }
    .d-section-desc { font-size: 13px; line-height: 1.8; color: #333; }
    .gallery { display: flex; flex-direction: column; gap: 10px; }
    .gallery img, .gallery video { width: 100%; display: block; }
    .gallery video { background: #000; }
    .vimeo-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .vimeo-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .embed-box { width: 100%; height: 80vh; border: none; display: block; }

    /* ── SLIDESHOW ── */
    .slideshow { margin: 10px 0; position: relative; width: 100%; background: #000; display: flex; align-items: center; justify-content: center; padding: 40px 80px; }
    .slideshow-track { width: 100%; overflow: hidden; }
    .slideshow-track img { width: 100%; display: none; object-fit: contain; max-height: 75vh; }
    .slideshow-track img.active { display: block; }
    .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 20px; line-height: 1; cursor: url("cursor-hand.png") 16 16, pointer !important; color: #fff; padding: 8px 16px; z-index: 2; opacity: 0.6; transition: opacity 0.15s; letter-spacing: 2px; }
    .slide-btn:hover { opacity: 1; }
    .slide-btn.prev { left: 16px; }
    .slide-btn.next { right: 16px; }

    /* ── PASSWORD MODAL ── */
    .password-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10000; }
    .password-overlay.on { display: flex; }
    .password-modal { background: #fff; padding: 40px; border-radius: 16px; max-width: 380px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .password-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #000; }
    .password-modal p { font-size: 13px; color: var(--gray); margin-bottom: 20px; line-height: 1.6; }
    .password-modal input { width: 100%; padding: 12px 16px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; font-family: inherit; }
    .password-modal input:focus { outline: none; border-color: var(--pink); }
    .password-modal input.error { border-color: #ff4444; }
    .password-error { font-size: 12px; color: #ff4444; margin-bottom: 16px; display: none; }
    .password-error.on { display: block; }
    .password-buttons { display: flex; gap: 8px; margin-top: 20px; }
    .password-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: url("cursor-hand.png") 16 16, pointer !important; font-family: inherit; transition: opacity 0.15s; }
    .password-buttons button:hover { opacity: 0.8; }
    .password-buttons .btn-cancel { background: #f5f5f5; color: #666; }
    .password-buttons .btn-submit { background: #000; color: #fff; }

    /* ── STAR TRAIL ── */
    .star { position: fixed; pointer-events: none; z-index: 99999; animation: starfall 1s ease-in forwards; }
    @keyframes starfall { from { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } to { transform: translateY(100px) rotate(180deg) scale(0); opacity: 0; } }

    /* ════════════════════════════════
       MOBILE STYLES  (≤ 700px)
       ════════════════════════════════ */
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; height: 100vh; }
      .right { display: none; }
      .left { height: 100dvh; }
      .left-top { padding: 12px 16px 0; }
      .logo-wrap { margin-bottom: 12px; }
      .cat-nav {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 0 16px;
        padding-bottom: 10px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .cat-nav::-webkit-scrollbar { display: none; }
      .cat-nav button { white-space: nowrap; font-size: 12px; padding: 4px 0; flex-shrink: 0; }
      .project-list { margin-top: 20px; }
      .proj-row { padding: 14px 16px; }
      .proj-title { font-size: 15px; }

      /* ── MOBILE BOTTOM SHEET ── */
      .mobile-sheet-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0);
        z-index: 200;
        pointer-events: none;
        transition: background 0.35s ease;
      }
      .mobile-sheet-backdrop.on {
        background: rgba(0,0,0,0.4);
        pointer-events: auto;
      }
      .mobile-sheet {
        display: flex;
        flex-direction: column;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 92dvh;
        background: #fff;
        border-radius: 20px 20px 0 0;
        z-index: 300;
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        overflow: hidden;
        will-change: transform;
      }
      .mobile-sheet.open { transform: translateY(0); }
      .sheet-handle-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
      }
      .sheet-handle {
        width: 36px; height: 4px;
        background: #ddd; border-radius: 2px;
        position: absolute;
        left: 50%; top: 8px;
        transform: translateX(-50%);
      }
      .sheet-close-btn {
        background: none; border: none;
        font-size: 20px; line-height: 1;
        color: #999; padding: 4px;
        cursor: pointer;
        margin-left: auto;
      }
      .sheet-body {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .sheet-body::-webkit-scrollbar { width: 0; }
      .sheet-body #mb-detail { padding: 20px 16px 80px; }
      .sheet-body .d-header { grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
      .sheet-body .d-title { font-size: 18px; }
      .sheet-body .d-section { grid-template-columns: 1fr; gap: 8px; }
      .sheet-body #mb-detail .gallery { gap: 8px; }
      .sheet-body .slideshow { padding: 24px 52px; }
      .sheet-body .vimeo-box { margin: 0; }
      .sheet-body .thumb-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .sheet-body .embed-box { height: 60vh; }
    }

    @media (min-width: 701px) {
      .mobile-sheet-backdrop,
      .mobile-sheet { display: none !important; }
    }
  </style>
</head>
<body>

<script>
/* ── 스타 트레일 ── */
let lastStar = 0;
document.addEventListener('mousemove', function(e) {
  const now = Date.now();
  if (now - lastStar < 50) return;
  lastStar = now;
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'star'); s.setAttribute('width', '12'); s.setAttribute('height', '12'); s.setAttribute('viewBox', '0 0 24 24');
  s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('fill', '#FF6FD6');
  p.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z');
  s.appendChild(p); document.body.appendChild(s);
  setTimeout(function() { s.remove(); }, 1000);
});

/* ── 기존 잠금 해제 상태 전부 제거 ── */
(function clearAllLocks() {
  Object.keys(localStorage).forEach(function(key) {
    if (key.startsWith('project_') && key.endsWith('_unlocked')) localStorage.removeItem(key);
  });
  Object.keys(sessionStorage).forEach(function(key) {
    if (key.startsWith('project_') && key.endsWith('_unlocked')) sessionStorage.removeItem(key);
  });
})();

/* ── 상태 ── */
let projects = [], activeCat = '', slideshowTimer = null;
let pendingProject = null;

const listEl          = document.getElementById('project-list');
const catNav          = document.getElementById('cat-nav');
const rightEl         = document.getElementById('right');
const rGrid           = document.getElementById('r-grid');
const rDetail         = document.getElementById('r-detail');

/* 모바일 시트 */
const sheetEl         = document.getElementById('mobile-sheet');
const sheetBackdrop   = document.getElementById('sheet-backdrop');
const sheetClose      = document.getElementById('sheet-close');
const mbDetail        = document.getElementById('mb-detail');
const sheetHandleBar  = document.getElementById('sheet-handle-bar');

/* 패스워드 */
const passwordOverlay = document.getElementById('password-overlay');
const passwordInput   = document.getElementById('password-input');
const passwordError   = document.getElementById('password-error');
const passwordSubmit  = document.getElementById('password-submit');
const passwordCancel  = document.getElementById('password-cancel');

/* ── 유틸 ── */
function isMobile() { return window.innerWidth <= 700; }
function clearSlideshowTimer() { if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; } }
function hideAll() { rGrid.classList.remove('on'); rDetail.classList.remove('on'); clearSlideshowTimer(); }

/* 항상 잠금 — 비밀번호 제거 전까지 무조건 잠김 */
function isProjectUnlocked(id) { return false; }
function unlockProject(id) {}

/* ── 모바일 SHEET ── */
function openSheet() {
  sheetEl.classList.add('open');
  sheetBackdrop.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  sheetEl.classList.remove('open');
  sheetBackdrop.classList.remove('on');
  document.body.style.overflow = '';
  listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
  clearSlideshowTimer();
}

sheetClose.addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', closeSheet);

/* 드래그-to-close (touch) */
(function() {
  var startY = 0, dragging = false, currentY = 0;
  sheetHandleBar.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
    dragging = true;
    sheetEl.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    var dy = e.touches[0].clientY - startY;
    if (dy < 0) dy = 0;
    currentY = dy;
    sheetEl.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  document.addEventListener('touchend', function() {
    if (!dragging) return;
    dragging = false;
    sheetEl.style.transition = '';
    if (currentY > 120) {
      closeSheet();
      sheetEl.style.transform = '';
    } else {
      sheetEl.style.transform = '';
    }
    currentY = 0;
  });
})();

/* ── 패스워드 모달 ── */
function showPasswordModal(p) {
  pendingProject = p;
  passwordInput.value = '';
  passwordError.classList.remove('on');
  passwordInput.classList.remove('error');
  passwordOverlay.classList.add('on');
  setTimeout(function() { passwordInput.focus(); }, 100);
}
function hidePasswordModal() {
  passwordOverlay.classList.remove('on');
  pendingProject = null;
  passwordInput.value = '';
  passwordError.classList.remove('on');
  passwordInput.classList.remove('error');
}

passwordCancel.addEventListener('click', hidePasswordModal);
passwordOverlay.addEventListener('click', function(e) { if (e.target === passwordOverlay) hidePasswordModal(); });
passwordSubmit.addEventListener('click', function() {
  if (!pendingProject) return;
  if (passwordInput.value === pendingProject.password) {
    hidePasswordModal();
    openDetailDirectly(pendingProject);
  } else {
    passwordError.classList.add('on');
    passwordInput.classList.add('error');
    passwordInput.value = '';
    passwordInput.focus();
  }
});
passwordInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') passwordSubmit.click();
  if (e.key === 'Escape') hidePasswordModal();
});

/* ── 렌더 헬퍼 ── */
function renderThumb(p) {
  if (!p.thumbnail || !p.thumbnail.src) return '';
  if (p.thumbnail.type === 'video') return '<video autoplay loop muted playsinline preload="metadata"><source src="' + p.thumbnail.src + '" type="video/mp4"></video>';
  return '<img src="' + p.thumbnail.src + '" alt="' + (p.title || '') + '">';
}

function renderMediaItem(m, title) {
  if (m.type === 'video')   return '<video autoplay loop muted playsinline><source src="' + m.src + '" type="video/mp4"></video>';
  if (m.type === 'vimeo')   return '<div class="vimeo-box"><iframe src="https://player.vimeo.com/video/' + m.id + '?autoplay=0&title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
  if (m.type === 'youtube') return '<div class="vimeo-box"><iframe src="https://www.youtube.com/embed/' + m.id + '?rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
  if (m.type === 'image')   return '<img src="' + (m.src || m.id || '') + '" alt="' + (title || '') + '">';
  return '';
}

function renderSlideshow(slides, idSuffix) {
  if (!slides || !slides.length) return '';
  var sid = idSuffix || 'main';
  var imgs = slides.map(function(s, i) {
    return '<img src="' + s.src + '" alt="slide ' + (i+1) + '" class="' + (i === 0 ? 'active' : '') + '">';
  }).join('');
  return '<div class="slideshow" id="slideshow-' + sid + '">' +
    '<button class="slide-btn prev" id="slide-prev-' + sid + '">&#8592;</button>' +
    '<div class="slideshow-track" id="slide-track-' + sid + '">' + imgs + '</div>' +
    '<button class="slide-btn next" id="slide-next-' + sid + '">&#8594;</button>' +
  '</div>';
}

function initSlideshowById(sid, total) {
  if (!total) return;
  var track = document.getElementById('slide-track-' + sid);
  if (!track) return;
  var imgs = track.querySelectorAll('img');
  var cur = 0;
  function goTo(n) {
    imgs[cur].classList.remove('active');
    cur = (n + total) % total;
    imgs[cur].classList.add('active');
  }
  function startAuto() {
    clearSlideshowTimer();
    slideshowTimer = setInterval(function() { goTo(cur + 1); }, 4000);
  }
  var prevBtn = document.getElementById('slide-prev-' + sid);
  var nextBtn = document.getElementById('slide-next-' + sid);
  if (prevBtn) prevBtn.addEventListener('click', function() { clearSlideshowTimer(); goTo(cur - 1); startAuto(); });
  if (nextBtn) nextBtn.addEventListener('click', function() { clearSlideshowTimer(); goTo(cur + 1); startAuto(); });
  startAuto();
}

/* ── 프로젝트 detail HTML 생성 (공통) ── */
function buildDetailHTML(p) {
  var desc = p.description && p.description.en ? p.description.en : '';
  var metaParts = [p.type, p.date, p.client].filter(Boolean);
  var embedHTML = p.embedUrl ? '<iframe class="embed-box" src="' + p.embedUrl + '" allow="fullscreen"></iframe>' : '';
  var media = p.media || [];
  var insertAt = (p.slides && p.slides.length && p.slideshowPosition != null) ? p.slideshowPosition : -1;

  var galleryHTML = '';
  if (insertAt >= 0) {
    var before = media.slice(0, insertAt).map(function(m) { return renderMediaItem(m, p.title); }).join('');
    var after  = media.slice(insertAt).map(function(m) { return renderMediaItem(m, p.title); }).join('');
    galleryHTML = embedHTML + before + '</div>' + renderSlideshow(p.slides, 'main') + '<div class="gallery">' + after;
  } else {
    galleryHTML = embedHTML + media.map(function(m) { return renderMediaItem(m, p.title); }).join('');
  }

  var sectionsHTML = '';
  if (p.sections && p.sections.length) {
    sectionsHTML = '<div class="d-sections">' + p.sections.map(function(s, si) {
      var sMediaHTML = (s.media || []).map(function(m) { return renderMediaItem(m, s.title); }).join('');
      var sEmbedHTML = s.embedUrl ? '<iframe src="' + s.embedUrl + '" style="width:100%;height:100vh;border:none;display:block;margin-top:10px;" allow="fullscreen"></iframe>' : '';
      var sSid = 'sec-' + si;
      var sSlidesHTML = (s.slides && s.slides.length) ? renderSlideshow(s.slides, sSid) : '';
      if (s.slides && s.slides.length) {
        setTimeout(function() { initSlideshowById(sSid, s.slides.length); }, 100);
      }
      return '<div class="d-section-wrap">' +
        '<div class="d-section"><div class="d-section-title">' + (s.title||'') + '</div><div class="d-section-desc">' + (s.desc||'') + '</div></div>' +
        (sEmbedHTML || '') + sSlidesHTML +
        (sMediaHTML ? '<div class="gallery">' + sMediaHTML + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
  }

  return '<div class="d-header">' +
    '<div class="d-left">' +
      '<div class="d-title">' + (p.title||'') + '</div>' +
      '<div class="d-meta">' + metaParts.join(' · ') + '</div>' +
      '<div class="d-collab">' + (p.collaboration||'') + '</div>' +
    '</div>' +
    (desc ? '<div class="d-desc">' + desc + '</div>' : '<div></div>') +
  '</div>' +
  '<div class="gallery">' + galleryHTML + '</div>' +
  sectionsHTML;
}

/* ── 그리드 렌더 ── */
function renderGrid(list) {
  if (!list.length) { rGrid.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>'; return; }
  rGrid.innerHTML = '<div class="thumb-grid">' + list.map(function(p) {
    var isExt = !!p.externalUrl;
    var href = isExt ? p.externalUrl : '#';
    var attrs = isExt ? 'target="_blank" rel="noopener noreferrer"' : 'data-id="' + p.id + '"';
    var lockBadge = (p.password && !isProjectUnlocked(p.id)) ? '<div class="thumb-lock-badge">🔒</div>' : '';
    return '<a class="thumb-card" href="' + href + '" ' + attrs + '>' + lockBadge + '<div class="thumb-media">' + renderThumb(p) + '</div><div class="thumb-info"><div class="thumb-title">' + (p.title||'') + '</div><div class="thumb-type">' + (p.type||'') + '</div></div></a>';
  }).join('') + '</div>';
  rGrid.querySelectorAll('.thumb-card[data-id]').forEach(function(card) {
    card.addEventListener('click', function(e) {
      e.preventDefault();
      var proj = projects.find(function(p) { return p.id === card.dataset.id; });
      if (proj) openDetail(proj);
    });
  });
}

/* ── 리스트 렌더 ── */
function renderList(list) {
  if (!list.length) { listEl.innerHTML = '<div style="padding:20px;color:#ccc;">No projects</div>'; return; }
  listEl.innerHTML = list.map(function(p) {
    var lockBadge = (p.password && !isProjectUnlocked(p.id)) ? '<span class="lock-badge">🔒</span>' : '';
    return '<a class="proj-row" data-id="' + p.id + '" href="#">' + lockBadge + '<div class="proj-title">' + (p.title||'') + '</div><div class="proj-type">' + (p.type||'') + '</div></a>';
  }).join('');
  listEl.querySelectorAll('.proj-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      e.preventDefault();
      var proj = projects.find(function(p) { return p.id === row.dataset.id; });
      if (!proj) return;
      if (proj.externalUrl) { window.open(proj.externalUrl, '_blank', 'noopener,noreferrer'); return; }
      listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
      row.classList.add('on');
      openDetail(proj);
    });
  });
}

/* ── GRID 뷰 ── */
function showGrid(list, fromPop) {
  hideAll(); renderGrid(list); rGrid.classList.add('on');
  rightEl.scrollTo({ top: 0, behavior: 'smooth' });
  listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
  if (!fromPop) history.pushState({ view: 'grid', cat: activeCat }, '');
}

/* ── DETAIL 열기 ── */
function openDetail(p, fromPop) {
  if (p.password && !isProjectUnlocked(p.id)) {
    showPasswordModal(p);
    return;
  }
  openDetailDirectly(p, fromPop);
}

function openDetailDirectly(p, fromPop) {
  if (!fromPop) history.pushState({ view: 'detail', id: p.id, cat: activeCat }, '');

  if (isMobile()) {
    mbDetail.innerHTML = buildDetailHTML(p);
    if (p.slides && p.slides.length) {
      setTimeout(function() { initSlideshowById('main', p.slides.length); }, 100);
    }
    sheetEl.querySelector('.sheet-body').scrollTop = 0;
    openSheet();
  } else {
    hideAll(); rDetail.classList.add('on');
    rDetail.innerHTML = buildDetailHTML(p);
    if (p.slides && p.slides.length) {
      setTimeout(function() { initSlideshowById('main', p.slides.length); }, 100);
    }
    rightEl.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ── 뒤로가기 ── */
window.addEventListener('popstate', function(e) {
  var state = e.state;
  if (!state || state.view === 'grid') {
    var cat = state ? (state.cat || '') : '';
    activeCat = cat;
    var filtered = cat ? projects.filter(function(p) { return (p.category||'').toLowerCase() === cat; }) : projects;
    catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
    catNav.querySelector('[data-cat="' + cat + '"]').classList.add('on');
    renderList(filtered); showGrid(filtered, true);
    if (isMobile()) closeSheet();
  } else if (state.view === 'detail') {
    var proj = projects.find(function(p) { return p.id === state.id; });
    listEl.querySelectorAll('.proj-row').forEach(function(r) { r.classList.remove('on'); });
    var activeRow = listEl.querySelector('.proj-row[data-id="' + state.id + '"]');
    if (activeRow) activeRow.classList.add('on');
    if (proj) openDetail(proj, true);
  }
});

/* ── 로고 ── */
document.getElementById('logo-link').addEventListener('click', function(e) {
  e.preventDefault();
  catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
  catNav.querySelector('[data-cat=""]').classList.add('on');
  activeCat = ''; renderList(projects); showGrid(projects);
  if (isMobile()) closeSheet();
});

/* ── 카테고리 ── */
catNav.querySelectorAll('button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    catNav.querySelectorAll('button').forEach(function(b) { b.classList.remove('on'); });
    btn.classList.add('on'); activeCat = btn.dataset.cat;
    var filtered = activeCat ? projects.filter(function(p) { return (p.category||'').toLowerCase() === activeCat; }) : projects;
    renderList(filtered); showGrid(filtered);
    if (isMobile()) closeSheet();
  });
});

/* ── 데이터 로드 ── */
fetch('./projects-data.json', { cache: 'no-store' })
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    projects = data.projects || [];
    renderList(projects);
    history.replaceState({ view: 'grid', cat: '' }, '');
    showGrid(projects, true);
  })
  .catch(function(err) {
    console.error(err);
    listEl.innerHTML = '<div style="padding:20px;color:#ccc;">Failed to load: ' + err.message + '</div>';
  });
</script>
</body>
</html>
