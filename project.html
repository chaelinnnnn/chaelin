<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project - Chaelin Kim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Neue+Haas+Grotesk+Display+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #fff;
      --text: #000;
      --border: #d0d0d0;
    }

    body {
      font-family: -apple-system, system-ui, Inter, Segoe UI, Roboto, Oxygen,
        Ubuntu, Cantarell, Open Sans, Helvetica Neue, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.6;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23FF6FD6' d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>")
          12 12,
        auto;
    }

    a,
    button {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23FF6FD6' d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>")
          12 12,
        pointer;
    }

    /* Falling Star */
    .falling-star {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: fall 1s ease-in forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100px) rotate(180deg) scale(0);
        opacity: 0;
      }
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      z-index: 1000;
      padding: 0 20px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
    }

    .logo {
      width: 150px;
      height: 85px;
      overflow: hidden;
    }

    .logo video {
      width: 180px;
      margin-left: -15px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
    }

    .contact-email {
      font-size: 13px;
      font-weight: 600;
    }

    main {
      margin-top: 180px;
    }

    .loading {
      text-align: center;
      padding: 100px 20px;
      font-size: 13px;
      color: #666;
    }

    .project-detail {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
      animation: fadeIn 0.6s ease forwards;
    }

    .project-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .project-info {
      font-size: 13px;
      color: #666;
      display: flex;
      gap: 12px;
    }

    .project-description {
      max-width: 800px;
      font-size: 13px;
      line-height: 1.8;
      margin-top: 30px;
    }

    .project-images {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .project-image img,
    .project-image video {
      width: 100%;
      display: block;
    }

    .vimeo-wrap {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }

    .vimeo-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .image-caption {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <a href="index.html">
          <video autoplay muted playsinline>
            <source src="logo.mp4" type="video/mp4" />
          </video>
        </a>
      </div>

      <nav>
        <a href="index.html">Art directing<br />& Brand Identity</a>
        <a href="index.html?category=interaction">Interaction</a>
        <a href="index.html?category=uxui">UX/UI</a>
        <a href="index.html?category=editorial">Editorial</a>
        <a href="index.html?category=film">Film</a>
        <a href="index.html?category=exhibition">Exhibition</a>
        <a href="index.html?page=about">About</a>
        <span class="contact-email">present1513@gmail.com</span>
      </nav>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading project...</div>
    <div id="projectContent" class="project-detail" style="display: none"></div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get("id");
    const currentLang = "en";

    fetch("projects-data.json", { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => {
        const project = data.projects.find((p) => p.id === projectId);
        if (!project) return;

        document.title = `${project.title} - Chaelin Kim`;

        const mediaHTML = (project.media || [])
          .map((item) => {
            if (item.type === "vimeo") {
              return `
                <div class="project-image">
                  <div class="vimeo-wrap">
                    <iframe src="https://player.vimeo.com/video/${item.id}" allowfullscreen></iframe>
                  </div>
                </div>`;
            }
            if (item.type === "video") {
              return `
                <div class="project-image">
                  <video autoplay muted loop playsinline>
                    <source src="${item.src}" type="video/mp4" />
                  </video>
                </div>`;
            }
            return `
              <div class="project-image">
                <img src="${item.src}" alt="${project.title}" />
              </div>`;
          })
          .join("");

        document.getElementById("projectContent").innerHTML = `
          <div class="project-title">${project.title}</div>
          <div class="project-info">
            <span>${project.type || ""}</span>
            <span>${project.client || ""}</span>
            <span>${project.date || ""}</span>
          </div>
          <div class="project-description">
            ${project.description?.[currentLang] || ""}
          </div>
          <div class="project-images">${mediaHTML}</div>
        `;

        document.getElementById("loading").style.display = "none";
        document.getElementById("projectContent").style.display = "block";
      });
  </script>
</body>
</html>
